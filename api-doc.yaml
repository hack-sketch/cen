openapi: 3.0.3
info:
  title: Community Exchange Network (CEN) API
  description: |
    # Community Exchange Network (CEN) — Complete OpenAPI Specification
    **Final Milestone Deliverable — Team 094**

    This specification fully details all RESTful API endpoints for the CEN multi-tenant platform.
    It encompasses hyper-local time-credit banking, shared equipment and physical tool lifecycles (lending, return, relisting, photo attachments), skill exchanges with edit-on-relist workflows, multi-resident society onboarding with secondary lead gating, Google Gemini AI engine automation (RAG semantic intent parsing, volunteer matchmaking, conversational assistant, circular summarization), trade dispute bilateral justifications, and community governance.

    ### Key Design Standards:
    - **OpenAPI Version**: 3.0.3 (Fully Swagger UI and Swagger Editor compatible)
    - **Authentication**: JWT Bearer token via `Authorization: Bearer <token>`
    - **Multi-Tenancy**: Scoped by `society_id` with strict operational isolation
    - **Error Handling**: Standardized RFC-7807 compliant error schemas across all routes
  version: 2.1.0
  contact:
    name: Team 094 Development Team
    email: dev@cen.app

servers:
  - url: http://localhost:8000
    description: Local Development Server
  - url: https://api.cen.app
    description: Production Environment

tags:
  - name: Authentication
    description: User registration, login authentication, JWT issuance, and credential recovery.
  - name: Users & Profiles
    description: Resident profile management, onboarding surveys, ID verification, and RBAC promotions.
  - name: Society Management
    description: Community onboarding applications, network provisioning, suspension guards, and join requests.
  - name: Household Registry
    description: Flat and unit inventory setup, sequential bulk generation, and occupancy mappings.
  - name: Time-Credit Wallet
    description: Hyper-local time-banking balances, transaction ledgers, and peer-to-peer credit transfers.
  - name: Marketplace Skills
    description: Skill exchange listings, coordinator moderation, edit-on-relist lifecycle, and booking escrow.
  - name: Marketplace Resources
    description: Physical tool and equipment sharing with photo attachments, borrowing, return, and relisting.
  - name: Community Events
    description: Event scheduling, coordinator operational gating, volunteer application rosters, and re-invitation.
  - name: Trade Disputes
    description: Bilateral exchange dispute arbitration with secondary participant justification submission.
  - name: Complaints & Audits
    description: Facility grievance reporting, privacy visibility filters, and coordinator resolution.
  - name: Notice Board
    description: Society announcement broadcasts, official circulars, and executive summarization.
  - name: Direct Messaging
    description: Real-time peer-to-peer encrypted resident communication.
  - name: AI Assistant
    description: Google Gemini LLM integrations (RAG semantic search, volunteer matching, chatbot, auto-tagging).
  - name: Analytics & Health
    description: Cross-society platform metrics, community engagement KPIs, and health check probes.

paths:
  # ---------------------------------------------------------------------------
  # 1. Authentication Module (/api/v1/auth)
  # ---------------------------------------------------------------------------
  /api/v1/auth/signup:
    post:
      summary: Register a new user account
      description: |
        **User Story Mapping:** As a prospective resident or community manager, I want to register a new CEN account with my email and password so that I can access my residential society network.
        
        Registers a new user with password hashing (bcrypt) and initial role assignment. Enforces unique email constraints.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                name:
                  type: string
                  example: "Rohit Sharma"
                email:
                  type: string
                  format: email
                  example: "rohit@example.com"
                password:
                  type: string
                  format: password
                  example: "Password123!"
                role:
                  type: string
                  enum: [resident, coordinator, admin, owner]
                  default: resident
                  example: "resident"
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '409':
          $ref: '#/components/responses/ConflictError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/login:
    post:
      summary: Authenticate user and issue JWT access token
      description: |
        **User Story Mapping:** As a registered user, I want to securely log in with my credentials so that I can obtain a session token to perform authenticated operations.
        
        Verifies credentials, checks suspension state, and returns a signed JWT access token alongside basic user profile information.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "resident@cen.app"
                password:
                  type: string
                  example: "password123"
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/auth/me:
    get:
      summary: Get current authenticated user profile
      description: |
        **User Story Mapping:** As an active session user, I want to retrieve my authenticated identity and assigned roles so that the UI can configure my dashboard permissions.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Authenticated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/auth/reset-password:
    post:
      summary: Direct password reset and credential recovery
      description: |
        **User Story Mapping:** As a user who forgot my password, I want to safely reset my credentials by confirming my email so that I can regain access to my account.
        
        Validates email existence, checks password match, rehashes password, and updates account record.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, new_password, confirm_password]
              properties:
                email:
                  type: string
                  format: email
                  example: "resident@cen.app"
                new_password:
                  type: string
                  format: password
                  example: "NewSecurePass123!"
                confirm_password:
                  type: string
                  format: password
                  example: "NewSecurePass123!"
      responses:
        '200':
          description: Password reset successfully
        '400':
          $ref: '#/components/responses/BadRequestError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ---------------------------------------------------------------------------
  # 2. Users & Profiles Module (/api/v1/users)
  # ---------------------------------------------------------------------------
  /api/v1/users/me:
    get:
      summary: Get detailed user profile and wallet credit balance
      description: |
        **User Story Mapping:** As a resident, I want to view my profile details, flat assignment, verification status, and credit balance.
      tags:
        - Users & Profiles
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile and wallet credit details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      summary: Update user profile attributes
      description: |
        **User Story Mapping:** As a resident, I want to edit my bio, phone number, and name so that my neighbors have current contact details.
      tags:
        - Users & Profiles
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Rohit Sharma"
                phone:
                  type: string
                  example: "+91 98765 43210"
                bio:
                  type: string
                  example: "DIY woodworker and high-school mathematics enthusiast."
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/users/me/survey:
    post:
      summary: Save 3-step resident onboarding survey
      description: |
        **User Story Mapping:** As a newly onboarded resident, I want to record my interests, offered skills, and volunteer availability so that the AI matchmaker can suggest relevant events and exchanges.
      tags:
        - Users & Profiles
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                interests:
                  type: array
                  items:
                    type: string
                  example: ["Gardening", "Environment", "Tech & IT"]
                skills_offered:
                  type: array
                  items:
                    type: string
                  example: ["Python Tutoring", "Carpentry"]
                volunteer_interest:
                  type: string
                  enum: ["yes", "no", "weekends"]
                  example: "yes"
      responses:
        '200':
          description: Survey responses saved
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/users/me/id-proof:
    post:
      summary: Upload resident ID proof document
      description: |
        **User Story Mapping:** As a resident applying to join a society, I want to upload my government/address ID proof so that coordinators can verify my residency.
      tags:
        - Users & Profiles
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_proof_url]
              properties:
                id_proof_url:
                  type: string
                  description: Base64 data URL string representing the scanned document
                  example: "data:image/png;base64,..."
      responses:
        '200':
          description: ID proof uploaded and set to pending verification
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/users/me/leave-society:
    post:
      summary: Atomic resident leave society operation
      description: |
        **User Story Mapping:** As a resident moving out of a community, I want to leave the society cleanly so that my flat unit slot is released and my coordinator privileges are revoked.
        
        Atomically unlinks resident from society, clears household unit occupancy, cancels active listings and pending bookings.
      tags:
        - Users & Profiles
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successfully departed society
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '400':
          $ref: '#/components/responses/BadRequestError'

  /api/v1/users:
    get:
      summary: List registered residents (or cross-community directory for Owner)
      description: |
        **User Story Mapping:** As a coordinator or platform owner, I want to browse the directory of registered users to manage member permissions and moderation.
      tags:
        - Users & Profiles
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: society_id
          schema:
            type: string
          description: Society identifier (optional for platform owner)
      responses:
        '200':
          description: Array of user profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/users/coordinators:
    get:
      summary: List active coordinators for a society
      description: |
        **User Story Mapping:** As a resident, I want to see who the active coordinators are in my society so that I know who to contact for moderation.
      tags:
        - Users & Profiles
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: society_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Array of active coordinator profiles
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/users/{user_id}/promote:
    post:
      summary: Promote resident to Coordinator with granular permissions
      description: |
        **User Story Mapping:** As an Admin or Platform Owner, I want to promote a trusted resident to Coordinator and configure their onboarding and deactivation privileges.
      tags:
        - Users & Profiles
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                can_manage_onboarding:
                  type: boolean
                  default: true
                can_deactivate_residents:
                  type: boolean
                  default: false
      responses:
        '200':
          description: User promoted to coordinator
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/users/{user_id}/demote:
    post:
      summary: Demote coordinator back to resident
      description: |
        **User Story Mapping:** As an Admin or Platform Owner, I want to revoke coordinator status from a user when their tenure ends.
      tags:
        - Users & Profiles
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User demoted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/users/{user_id}/verify-id-proof:
    post:
      summary: Verify or reject resident ID proof document
      description: |
        **User Story Mapping:** As a coordinator, I want to verify a resident's uploaded ID document so that their membership status is authenticated.
      tags:
        - Users & Profiles
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
        - in: query
          name: verified
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: Verification status updated
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ---------------------------------------------------------------------------
  # 3. Societies & Onboarding Module (/api/v1/societies)
  # ---------------------------------------------------------------------------
  /api/v1/societies:
    get:
      summary: List and search registered residential societies
      description: |
        **User Story Mapping:** As a resident looking for my community, I want to search registered societies by name or location so that I can submit a join request.
      tags:
        - Society Management
      parameters:
        - in: query
          name: name
          schema:
            type: string
          description: Search term for society name or address
      responses:
        '200':
          description: Array of registered society records

  /api/v1/societies/applications:
    post:
      summary: Submit proposal to onboard a new residential society
      description: |
        **User Story Mapping:** As a society association lead, I want to propose onboarding my residential complex on CEN so that my community can form a mutual-aid network.
      tags:
        - Society Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocietyApplicationCreate'
      responses:
        '201':
          description: Application submitted for Platform Owner review
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    get:
      summary: List pending society onboarding proposals (Owner)
      description: |
        **User Story Mapping:** As the platform owner, I want to review all pending society applications to verify documentation and approve network provisioning.
      tags:
        - Society Management
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Array of pending society applications
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/societies/applications/{id}/approve:
    post:
      summary: Approve society onboarding proposal and provision network key
      description: |
        **User Story Mapping:** As the platform owner, I want to approve a verified society proposal, set its initial credit allocation and capacity cap, and generate its unique invite key.
      tags:
        - Society Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                capacity:
                  type: integer
                  example: 120
                initial_credits:
                  type: integer
                  example: 10
                members_per_household:
                  type: integer
                  example: 4
      responses:
        '200':
          description: Society activated and provisioned
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/societies/applications/{id}/reject:
    post:
      summary: Reject society proposal with mandatory feedback reason
      description: |
        **User Story Mapping:** As the platform owner, I want to reject an incomplete society application with constructive remarks so that the applicant knows what to fix.
      tags:
        - Society Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rejection_reason]
              properties:
                rejection_reason:
                  type: string
                  example: "Provided complex registration certificate is illegible; please upload clear PDF."
      responses:
        '200':
          description: Application rejected
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/societies/applications/{id}/resubmit:
    post:
      summary: Revise and resubmit rejected society onboarding proposal
      description: |
        **User Story Mapping:** As an applicant whose society proposal was rejected, I want to update my proposal details and resubmit it for re-evaluation.
      tags:
        - Society Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocietyApplicationCreate'
      responses:
        '200':
          description: Proposal resubmitted and status shifted to pending
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/societies/{society_id}/suspend:
    post:
      summary: Platform Owner emergency suspension of society network
      description: |
        **User Story Mapping:** As the platform owner, I want to temporarily suspend a society with compliance violations, locking operational routes and displaying a clear lockdown notice.
      tags:
        - Society Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: society_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: "Pending compliance verification and safety audit."
      responses:
        '200':
          description: Society suspended and lockdown guard enabled
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/societies/{society_id}/revoke-suspension:
    post:
      summary: Restore suspended society network to active state
      description: |
        **User Story Mapping:** As the platform owner, I want to lift a suspension once compliance issues are resolved so that residents regain full exchange capabilities.
      tags:
        - Society Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: society_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Society restored to active operational status
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/societies/join-requests:
    post:
      summary: Submit resident membership join request
      description: |
        **User Story Mapping:** As a resident, I want to submit a join request for a specific flat unit and upload my address proof for coordinator approval.
      tags:
        - Society Management
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [society_id, household_id, unit_number]
              properties:
                society_id:
                  type: string
                household_id:
                  type: string
                unit_number:
                  type: string
                  example: "Tower A 101"
                id_proof_url:
                  type: string
      responses:
        '201':
          description: Join request submitted
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/societies/join-requests/{id}/approve:
    post:
      summary: Approve resident join request (Primary Lead & Admin Gated)
      description: |
        **User Story Mapping:** As a primary household lead or society admin, I want to approve a new co-occupant's join request to grant them initial community time-credits.
        
        Enforces hierarchical gating: secondary residents in the same flat receive 403 Forbidden.
      tags:
        - Society Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Join request approved and initial credits granted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/societies/join-requests/{id}/reject:
    post:
      summary: Reject resident join request and free unit slot
      description: |
        **User Story Mapping:** As a primary household lead or coordinator, I want to reject an invalid join request and unlock the flat slot.
      tags:
        - Society Management
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Join request rejected
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ---------------------------------------------------------------------------
  # 4. Household Registry Module (/api/v1/households)
  # ---------------------------------------------------------------------------
  /api/v1/households:
    get:
      summary: List registered household units in a society
      description: |
        **User Story Mapping:** As a resident or coordinator, I want to view the grid of household units in my society and check occupancy states.
      tags:
        - Household Registry
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: society_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Array of household unit objects
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Register a single household unit
      description: |
        **User Story Mapping:** As an admin, I want to add an individual flat unit into the society registry.
      tags:
        - Household Registry
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [society_id, unit_number]
              properties:
                society_id:
                  type: string
                unit_number:
                  type: string
                  example: "Tower A 101"
      responses:
        '201':
          description: Unit registered
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/households/bulk:
    post:
      summary: Bulk-generate sequential household unit range
      description: |
        **User Story Mapping:** As a society administrator setting up a new complex, I want to bulk-create hundreds of flat units sequentially across blocks (e.g. Block A 101–108).
      tags:
        - Household Registry
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [society_id, start_unit, end_unit]
              properties:
                society_id:
                  type: string
                blocks:
                  type: array
                  items:
                    type: string
                  example: ["A", "B"]
                start_unit:
                  type: integer
                  example: 101
                end_unit:
                  type: integer
                  example: 108
                format_pattern:
                  type: string
                  example: "Block {Block}-{Unit}"
      responses:
        '201':
          description: Units generated successfully
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/households/{id}:
    put:
      summary: Edit unit number for a registered household
      description: |
        **User Story Mapping:** As an admin, I want to rename or fix typos in a household unit identifier.
      tags:
        - Household Registry
      security:
