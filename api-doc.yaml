          content:
            application/json:
              schema:
                type: object
                properties:
                  credit_balance:
                    type: integer
                    example: 25
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/wallet/transactions:
    get:
      summary: Get user transaction ledger history
      description: |
        **User Story Mapping:** As a resident, I want to view my complete earning and spending ledger so that I can audit my time-credit transactions.
      tags:
        - Time-Credit Wallet
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Chronological list of credit transactions
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/wallet/transfer:
    post:
      summary: Atomic peer-to-peer time credit transfer
      description: |
        **User Story Mapping:** As a resident, I want to transfer time credits directly to a neighbor for a completed service or shared good.
        
        Enforces atomic debit/credit operations, positive non-zero amounts, self-transfer guards, and sufficient balance verification.
      tags:
        - Time-Credit Wallet
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient_id, amount]
              properties:
                recipient_id:
                  type: string
                amount:
                  type: integer
                  minimum: 1
                  example: 3
                description:
                  type: string
                  example: "Payment for 1hr piano tutoring session"
      responses:
        '200':
          description: Credits transferred successfully
