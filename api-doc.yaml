    post:
      summary: Submit participant explanation or counter-justification note
      description: |
        **User Story Mapping:** As the secondary counterparty in a dispute, I want to submit my statement and explanation to ensure fair arbitration.
      tags:
        - Trade Disputes
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  example: "The equipment was inspected prior to handover; borrower dropped it on paving."
      responses:
        '200':
          description: Note attached
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/disputes/{id}/status:
    put:
      summary: Coordinator arbitrate and resolve dispute
      description: |
        **User Story Mapping:** As a coordinator, I want to arbitrate a dispute, log binding resolution notes, and resolve or dismiss the case.
      tags:
        - Trade Disputes
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [under_review, resolved, dismissed]
                  example: "resolved"
                resolution_notes:
                  type: string
                  example: "Parties agreed on 3 credit repair reimbursement."
      responses:
        '200':
          description: Dispute arbitrated
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ---------------------------------------------------------------------------
  # 10. Complaints & Grievance Redressal (/api/v1/complaints)
  # ---------------------------------------------------------------------------
  /api/v1/complaints:
    get:
      summary: List facility complaints feed (filters private complaints for residents)
      description: |
        **User Story Mapping:** As a resident, I want to see public maintenance grievances; as a coordinator, I want full visibility into private issues.
      tags:
        - Complaints & Audits
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: society_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Complaints feed
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: File a new facility complaint
      description: |
        **User Story Mapping:** As a resident, I want to report a facility issue (e.g. lift malfunction, water leak) with private/anonymous flags.
      tags:
        - Complaints & Audits
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, category, description]
              properties:
                title:
                  type: string
                  example: "Water leakage near Block B corridor"
                category:
                  type: string
                  example: "Maintenance"
                description:
                  type: string
                  example: "Pipe dripping steadily near flat 204."
                is_private:
                  type: boolean
                  default: false
      responses:
        '201':
          description: Complaint filed
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/complaints/{id}/resolve:
    post:
      summary: Coordinator resolve grievance with remarks
      description: |
        **User Story Mapping:** As a facility manager, I want to resolve a complaint and log repair notes so residents know the issue is addressed.
      tags:
        - Complaints & Audits
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resolution_notes:
                  type: string
                  example: "Plumber repaired joint and sealed pipe."
      responses:
        '200':
          description: Complaint resolved
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  # ---------------------------------------------------------------------------
  # 11. Notice Board & Direct Messaging (/api/v1/notices, /api/v1/chat)
  # ---------------------------------------------------------------------------
  /api/v1/notices:
    get:
      summary: List society circulars and notices
      description: |
        **User Story Mapping:** As a resident, I want to view official society announcements and maintenance circulars.
      tags:
        - Notice Board
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: society_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Array of notices
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Post a notice circular (Admin / Coordinator)
      description: |
        **User Story Mapping:** As a community coordinator, I want to post an official circular for all residents to see.
      tags:
        - Notice Board
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content, category]
              properties:
                title:
                  type: string
                  example: "Water Tank Cleaning Schedule"
                content:
                  type: string
                  example: "Water supply will be suspended on Sunday from 10 AM to 1 PM for annual overhead tank cleaning."
                category:
                  type: string
                  example: "Maintenance"
      responses:
        '201':
          description: Notice published
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/chat/messages:
    get:
      summary: Fetch direct message conversation with another resident
      description: |
        **User Story Mapping:** As a resident coordinating an exchange, I want to view my direct chat history with a neighbor.
      tags:
        - Direct Messaging
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: other_user_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Conversation message history
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    post:
      summary: Send a direct chat message to a resident
      description: |
        **User Story Mapping:** As a resident, I want to send a direct message to a neighbor to coordinate tool collection or skill timing.
      tags:
        - Direct Messaging
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receiver_id, content]
              properties:
                receiver_id:
                  type: string
                content:
                  type: string
                  example: "Hi! Are you free at 5 PM today for the drill handover?"
      responses:
        '201':
          description: Message delivered
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  # ---------------------------------------------------------------------------
  # 12. Google Gemini AI Engine & Analytics (/api/v1/ai, /api/v1/analytics, /health)
  # ---------------------------------------------------------------------------
  /api/v1/ai/chatbot:
    post:
      summary: Interactive Society AI Assistant (Gemini LLM with Society RAG context)
      description: |
        **User Story Mapping:** As a resident with questions about society rules, balances, or available tools, I want to ask the AI assistant for instant, grounded answers.
      tags:
        - AI Assistant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  example: "How do I borrow tools from the shared resource library?"
      responses:
        '200':
          description: AI response generated
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/ai/match-marketplace:
    post:
      summary: Natural Language RAG Intent Parser & Layman Summarizer
      description: |
        **User Story Mapping:** As a resident typing everyday colloquial search queries (e.g. 'fix leaking bathroom tap'), I want AI to semantically match relevant skills/tools and provide a plain-English summary.
      tags:
        - AI Assistant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, societyId]
              properties:
                query:
                  type: string
                  example: "drill heavy concrete screws into balcony wall"
                societyId:
                  type: string
      responses:
        '200':
          description: Scored semantic match items with plain-English summary
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /api/v1/ai/suggest-volunteers:
    get:
      summary: Dynamic multi-attribute volunteer candidate recommendation engine
      description: |
        **User Story Mapping:** As an event organizer, I want AI to score and recommend best-fit resident volunteers (62%–98%) based on their interests, skills, and past drives.
      tags:
        - AI Assistant
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: event_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Recommended volunteer roster candidates
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /api/v1/ai/summarize-notice:
    post:
      summary: Circular notice executive summarizer
      description: |
        **User Story Mapping:** As a busy resident, I want AI to extract a concise 2-bullet summary from lengthy notice circulars.
      tags:
        - AI Assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  example: "Detailed notice text about upcoming elevator replacement..."
      responses:
        '200':
          description: Executive summary
        '400':
          $ref: '#/components/responses/BadRequestError'

  /api/v1/ai/categorize-complaint:
    post:
      summary: Facility complaint urgency & priority classifier
      description: |
        **User Story Mapping:** As a facility manager, I want AI to automatically classify complaint categories and detect safety urgency levels.
      tags:
        - AI Assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  example: "Exposed live wire sparking in parking lot."
      responses:
        '200':
          description: Category and urgency priority
        '400':
          $ref: '#/components/responses/BadRequestError'

  /api/v1/ai/auto-tag:
    post:
      summary: Auto-tag listing text into categories and keywords
      description: |
        **User Story Mapping:** As a resident creating a listing, I want AI to automatically suggest category tags and credit rates.
      tags:
        - AI Assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  example: "Acoustic guitar lessons for beginner chords"
      responses:
        '200':
          description: Extracted categories and keyword tags
        '400':
          $ref: '#/components/responses/BadRequestError'

  /api/v1/analytics/owner:
    get:
      summary: Global cross-society KPI overview (Platform Owner)
      description: |
        **User Story Mapping:** As the platform owner, I want a global KPI dashboard showing active societies, total member counts, and credit exchange velocity.
      tags:
        - Analytics & Health
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Platform volume and network health metrics
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'

  /api/v1/analytics/society/{id}:
    get:
      summary: Society-level health and transaction metrics
      description: |
        **User Story Mapping:** As a society administrator, I want to view engagement rates, resolution times, and credit velocity within my society.
      tags:
        - Analytics & Health
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Society activity and member engagement metrics
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /health:
    get:
      summary: Server health check probe
      description: |
        **User Story Mapping:** As an automated DevOps monitor or developer, I want to ping the health check probe to verify API uptime.
      tags:
        - Analytics & Health
      responses:
        '200':
          description: Operational status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your signed JWT access token in the format `Bearer <token>`

  schemas:
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        tokenType:
          type: string
          example: "bearer"
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id:
          type: string
          example: "u-101"
        name:
          type: string
          example: "Rohit Sharma"
        email:
          type: string
          format: email
          example: "rohit@example.com"
        role:
          type: string
          enum: [resident, coordinator, admin, owner]
          example: "resident"
        societyId:
          type: string
          nullable: true
          example: "soc-1"
        householdId:
          type: string
          nullable: true
          example: "hh-101"
        creditBalance:
          type: integer
          example: 25
        isCoordinator:
          type: boolean
          example: false
        isPrimaryResident:
          type: boolean
          example: true
        idProofUploaded:
          type: boolean
          example: true
        idProofVerified:
          type: boolean
          example: true
        idProofUrl:
          type: string
          nullable: true

    SocietyApplicationCreate:
      type: object
      required: [society_name, type, address, applicant_name, applicant_contact, reason]
      properties:
        society_name:
          type: string
          example: "Oasis Green Heights"
        type:
          type: string
          example: "Residential Apartment"
        address:
          type: string
          example: "42 Eco Park Road, Bangalore"
        applicant_name:
          type: string
          example: "Priya Menon"
        applicant_contact:
          type: string
          example: "priya@example.com"
        reason:
          type: string
          example: "Founding mutual-aid tool library and skill sharing community."
        resident_count:
          type: integer
          default: 100
          example: 120
        members_per_household:
          type: integer
          default: 4
          example: 4
        initial_credits:
          type: integer
          default: 10
          example: 10

    ItemRejectPayload:
      type: object
      required: [rejection_reason]
      properties:
        rejection_reason:
          type: string
          description: Mandatory moderation feedback explaining why the listing is being declined
          example: "Listing description lacks safety instructions and borrowing term conditions."

    SkillCreate:
      type: object
      required: [title, category, credits, description]
      properties:
        title:
          type: string
          example: "Mathematics & Calculus Tutoring"
        category:
          type: string
          example: "Tutoring"
        credits:
          type: integer
          minimum: 1
          example: 5
        description:
          type: string
          example: "Grade 10 to 12 calculus coaching and exam problem solving."
        tags:
          type: array
          items:
            type: string
          example: ["math", "calculus", "highschool"]

    SkillUpdate:
      type: object
      properties:
        title:
          type: string
        category:
          type: string
        credits:
          type: integer
          minimum: 1
        description:
          type: string
        tags:
          type: array
          items:
            type: string

    ResourceCreate:
      type: object
      required: [name, category, credits, description]
      properties:
        name:
          type: string
          example: "Bosch Impact Drill (850W)"
        category:
          type: string
          example: "Tools"
        credits:
          type: integer
          minimum: 1
          example: 3
        description:
          type: string
          example: "Heavy duty hammer drill with masonry and wood drill bit sets."
        image_url:
          type: string
          nullable: true
          description: Base64 data URL or uploaded image URL of the physical equipment
          example: "data:image/jpeg;base64,..."

    ResourceUpdate:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        credits:
          type: integer
          minimum: 1
        description:
          type: string
        image_url:
          type: string
          nullable: true

    EventCreate:
      type: object
      required: [title, description, date]
      properties:
        title:
          type: string
          example: "Annual Monsoon Tree Planting Drive"
        description:
          type: string
          example: "Planting native trees across common park area. Tools and saplings provided."
        date:
          type: string
          example: "2026-09-20"
        start_time:
          type: string
          example: "09:00"
        end_time:
          type: string
          example: "12:00"
        location:
          type: string
          example: "Central Society Garden"
        volunteers_needed:
          type: integer
          default: 10

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          example: "Detailed error description"
        code:
          type: string
          example: "VALIDATION_ERROR"

  responses:
    BadRequestError:
      description: Invalid request parameters, schema validation failure, or domain business logic error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: "Insufficient wallet time-credit balance for this transfer"
            code: "INSUFFICIENT_FUNDS"

    UnauthorizedError:
      description: Authentication token is missing, malformed, or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: "Could not validate credentials"
            code: "UNAUTHORIZED"

    ForbiddenError:
      description: Access forbidden due to RBAC permissions, self-approval guard, secondary resident lock, or society suspension
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: "Coordinators cannot approve their own listings"
            code: "FORBIDDEN_SELF_APPROVAL"

    NotFoundError:
      description: Target resource, user, society, or booking record was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: "Resource item not found"
            code: "NOT_FOUND"

    ConflictError:
      description: Resource state conflict, duplicate unique email, or locked slot
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: "Email address is already registered"
            code: "DUPLICATE_EMAIL"

    InternalServerError:
      description: Unhandled internal server exception
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail: "Internal server error occurred while processing request"
            code: "INTERNAL_ERROR"
