      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  example: "What is my credit balance?"
      responses:
        '200':
          description: AI response generated

  /api/v1/ai/auto-tag:
    post:
      summary: Auto-tag listing content using AI
      tags:
        - AI Assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  example: "Acoustic guitar lessons"
      responses:
        '200':
          description: Category and tags extracted

  /api/v1/ai/categorize-complaint:
    post:
      summary: Complaint urgency priority classifier
      tags:
        - AI Assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  example: "Dangerous threat in garden"
      responses:
        '200':
          description: Category and priority level returned

  /api/v1/ai/summarize-notice:
    post:
      summary: Noticeboard announcement summarizer
      tags:
        - AI Assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  example: "Elevator maintenance tomorrow between 10am and 12pm."
      responses:
        '200':
          description: Concise one-sentence summary returned

  /api/v1/ai/match-marketplace:
    post:
      summary: Natural language marketplace query matcher
      tags:
        - AI Assistant
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, societyId]
              properties:
                query:
                  type: string
                  example: "python programming tutor"
                societyId:
                  type: string
      responses:
        '200':
          description: Scored matching skills and resources

  /api/v1/ai/suggest-volunteers:
    get:
      summary: AI volunteer roster candidate matcher
      tags:
        - AI Assistant
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: event_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Array of recommended candidate objects

  # ---------------------------------------------------------------------------
  # 13. Analytics & System Health (/api/v1/analytics, /health)
  # ---------------------------------------------------------------------------
  /api/v1/analytics/owner:
    get:
      summary: Cross-society platform analytics (Owner)
      tags:
        - Analytics
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Platform KPIs and volume metrics

  /api/v1/analytics/society/{id}:
    get:
      summary: Society health & engagement analytics (Admin / Owner)
      tags:
        - Analytics
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Society capacity and resolution metrics

  /health:
    get:
      summary: Server health check
      tags:
        - System Health
      responses:
        '200':
          description: Server status OK

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequestError:
      description: Bad request parameters or business logic failure
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
                example: "Invalid parameters"
    UnauthorizedError:
      description: Missing or invalid JWT access token
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
                example: "Could not validate credentials"
    ForbiddenError:
      description: Action forbidden by RBAC or borrowing deletion guard
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
                example: "Forbidden: Cannot delete resource while currently borrowed"
